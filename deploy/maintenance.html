		<style>
			:root {
				color-scheme: light;
				--ink: #20406a;
				--deep: #15314e;
				--coral: #ff6a45;
				--paper: #f7f3ea;
				--muted: #566379;
				--line: #e6dfd1;
				font-family:
					'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
				color: var(--ink);
				background: var(--paper);
				font-synthesis: none;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-width: 280px;
			}
			.page {
				min-height: 100vh;
				min-height: 100svh;
				display: flex;
				flex-direction: column;
				padding: 24px clamp(24px, 5vw, 80px) 26px;
			}
			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 24px;
			}
			.brand {
				display: block;
				width: 280px;
				height: auto;
			}
			.platform {
				font-size: 13px;
				letter-spacing: 2px;
				color: var(--muted);
			}
			main {
				width: min(100%, 1080px);
				margin: auto;
				padding: 64px 0 88px;
				display: grid;
				grid-template-columns: 1.3fr 1fr;
				gap: 60px;
				align-items: center;
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				font-size: 14px;
				color: var(--muted);
			}
			.status::before {
				content: '';
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--coral);
			}
			h1 {
				margin: 25px 0 22px;
				font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
				font-size: clamp(34px, 4vw, 54px);
				line-height: 1.35;
				font-weight: 600;
				letter-spacing: 0.01em;
			}
			.description {
				margin: 0;
				color: var(--muted);
				font-size: 16px;
				line-height: 2;
			}
			.retry {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 12px;
				min-height: 50px;
				margin-top: 34px;
				padding: 14px 24px;
				background: var(--ink);
				color: var(--paper);
				border-radius: 6px;
				font-size: 15px;
				font-weight: 500;
				text-decoration: none;
				transition: background 150ms;
			}
			.retry:hover {
				background: var(--deep);
			}
			.retry:focus-visible {
				outline: 3px solid var(--coral);
				outline-offset: 5px;
			}
			.hint {
				max-width: 380px;
				margin: 17px 0 0;
				font-size: 12px;
				line-height: 1.9;
				color: var(--muted);
			}
			.art {
				position: relative;
				width: min(100%, 350px);
				margin: 24px auto;
			}
			.art::before {
				content: '';
				position: absolute;
				inset: 12px -12px -12px 12px;
				border: 1px solid #d9d1c2;
				background: #eee8dc;
				border-radius: 3px;
			}
			.sheet {
				position: relative;
				min-height: 390px;
				background: #fffdf8;
				border: 1px solid var(--line);
				border-radius: 3px;
				padding: 34px;
				box-shadow: 0 18px 40px -28px #20406a38;
				text-align: center;
			}
			.bookmark {
				position: absolute;
				top: -1px;
				right: 32px;
				width: 23px;
				height: 49px;
				background: var(--coral);
				clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 83%, 0 100%);
			}
			.mark {
				display: block;
				width: 150px;
				height: 150px;
				margin: 24px auto 28px;
			}
			.paper-lines {
				display: grid;
				gap: 14px;
				margin: 0 12px;
			}
			.paper-lines span {
				display: block;
				height: 1px;
				background: var(--line);
			}
			.paper-lines span:last-child {
				width: 65%;
			}
			.sheet-caption {
				margin: 28px 0 0;
				font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
				color: var(--ink);
				font-size: 18px;
				letter-spacing: 2px;
			}
			footer {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				padding-top: 20px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 12px;
				line-height: 1.8;
			}
			@media (max-width: 760px) {
				.page {
					padding: 12px 24px 22px;
				}
				header {
					justify-content: center;
				}
				.brand {
					width: 250px;
				}
				.platform {
					display: none;
				}
				main {
					grid-template-columns: 1fr;
					gap: 40px;
					padding: 36px 0 50px;
					text-align: center;
				}
				h1 {
					margin: 20px 0;
				}
				.hint {
					margin-left: auto;
					margin-right: auto;
				}
				.retry {
					margin-top: 26px;
				}
				.art {
					width: min(80%, 270px);
					margin: 0 auto;
				}
				.sheet {
					min-height: 0;
					padding: 22px;
				}
				.mark {
					width: 120px;
					height: 120px;
					margin: 16px auto 22px;
				}
				.sheet-caption {
					font-size: 16px;
					margin-top: 24px;
					letter-spacing: 1px;
				}
				footer {
					justify-content: center;
					text-align: center;
					flex-wrap: wrap;
					gap: 5px 20px;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.retry {
					transition: none;
				}
			}
		</style>
	</head>
