# Install at /etc/nginx/snippets/rightwrite-maintenance.conf.
# Include inside the site's serving server block, beside location /.
proxy_intercept_errors on;
error_page 502 503 504 =503 /maintenance.html;

location = /maintenance.html {
    internal;
    root /var/www/rightwrite;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    # Location-level add_header overrides inherited headers on existing Nginx versions.
    add_header Strict-Transport-Security "max-age=15768000" always;
}
